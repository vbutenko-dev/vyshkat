name: Go checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache-dependency-path: go.sum
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: |
          unformatted_files=$(gofmt -l cmd internal)
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -cover ./...
      - name: Build
        run: go build ./...
